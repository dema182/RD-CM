name: Build and Release AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pip wget fuse3

      - name: Install PyInstaller
        run: |
          python3 -m pip install --break-system-packages pyinstaller

      - name: Build application
        run: |
          python3 -m PyInstaller             --noconfirm             --clean             --onefile             --windowed             --name RD-CM             src/retrodeck_collection_manager.py

      - name: Prepare AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp dist/RD-CM AppDir/usr/bin/RD-CM
          cp packaging/AppRun AppDir/AppRun
          cp packaging/RD-CM.desktop AppDir/RD-CM.desktop
          chmod +x AppDir/AppRun AppDir/usr/bin/RD-CM

      - name: Download appimagetool
        run: |
          wget -q             https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage             -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool --appimage-extract-and-run             AppDir RD-CM-x86_64.AppImage

      - name: Verify AppImage
        run: |
          test -s RD-CM-x86_64.AppImage
          file RD-CM-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RD-CM-x86_64-AppImage
          path: RD-CM-x86_64.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RD-CM-x86_64.AppImage
          generate_release_notes: true
